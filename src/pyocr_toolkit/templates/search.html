{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<h1>Search all documents</h1>
<form id="lib-search" class="toolbar" action="/search">
  <input type="search" name="q" id="q" value="{{ q }}" placeholder="Words or a phrase…" autofocus class="grow">
  <label class="check"><input type="checkbox" name="src" value="native" checked> native text</label>
  <label class="check"><input type="checkbox" name="src" value="ocr" checked> OCR</label>
  <label class="check"><input type="checkbox" name="src" value="llm" checked> LLM</label>
  <button class="btn primary">Search</button>
</form>
<p class="small muted">Case-insensitive; a phrase also matches across line breaks. OCR and LLM text is only
  searched where it has been extracted.</p>
<div id="lib-results"></div>
{% endblock %}
{% block scripts %}<script src="/static/search.js?v={{ version }}"></script>{% endblock %}
