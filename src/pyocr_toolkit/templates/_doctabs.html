{% from "_icons.html" import icon %}
<div class="doc-header">
  <div class="doc-title">
    {% if doc.workspaces %}<a href="/workspaces/{{ doc.workspaces[0].id }}" class="crumb" title="Workspace">{{ doc.workspaces[0].name }}</a>{% else %}<a href="/documents" class="crumb">Library</a>{% endif %}<span class="sep">/</span>
    <b title="{{ doc.filename }}">{{ doc.filename }}</b>
    <span class="muted">{{ doc.page_count }} page{{ 's' if doc.page_count != 1 }} · {{ doc.filetype|upper }} · {{ doc.size_bytes|filesize }}</span>
  </div>
  <nav class="doc-tabs">
    <a href="/documents/{{ doc.id }}" class="{{ 'active' if doc_tab == 'overview' }}">Overview</a>
    <a href="/documents/{{ doc.id }}/pages/1" class="{{ 'active' if doc_tab == 'pages' }}">Page inspector</a>
    <a href="/documents/{{ doc.id }}/text" class="{{ 'active' if doc_tab == 'text' }}">Full text</a>
    <a href="/documents/{{ doc.id }}/compare" class="{{ 'active' if doc_tab == 'compare' }}">Compare</a>
  </nav>
</div>
