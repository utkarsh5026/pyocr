[project]
name = "pyocr"
version = "0.1.0"
description = "Inspect PDF / image text extraction: native text layer vs Tesseract OCR vs LLM transcription, side by side."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
    "rapidfuzz>=3.6",
    "anthropic>=1.0",
    "openai>=1.40",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pyocr = "pyocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
