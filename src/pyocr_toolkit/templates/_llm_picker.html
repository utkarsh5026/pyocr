{# Provider / model / prompt picker. common.js fills it from /api/config. #}
<div class="llm-picker" data-llm-picker>
  <label>Provider <select data-provider></select></label>
  <label>Model <input data-model list="{{ picker_id|default('pk') }}-models" autocomplete="off">
    <datalist id="{{ picker_id|default('pk') }}-models"></datalist></label>
  <label>Prompt <select data-prompt></select></label>
  <details data-custom-box hidden class="custom-prompt">
    <summary>Custom prompt</summary>
    <textarea data-custom rows="7"></textarea>
  </details>
  <div data-schema-box hidden class="schema-box">
    <div class="schema-row">
      <label>Fields to extract <select data-schema-preset></select></label>
      <span class="small muted" data-schema-hint></span>
    </div>
    <details data-schema-edit class="custom-prompt">
      <summary>JSON Schema <span class="muted">(edit to make your own)</span></summary>
      <textarea data-schema rows="10" spellcheck="false" aria-label="JSON Schema"></textarea>
      <div class="small" data-schema-status></div>
    </details>
  </div>
  <div class="picker-status small" data-status></div>
</div>
