name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - name: Install the wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/pyocr --version && /tmp/venv/bin/pyocr doctor || true
          /tmp/venv/bin/python -c "from fastapi.testclient import TestClient; from pyocr_toolkit.api import create_app; c = TestClient(create_app()); assert c.get('/').status_code == 200; assert c.get('/static/common.js').status_code == 200"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pyocr-toolkit .
      - name: Smoke test
        run: |
          docker run -d --name pyocr -p 8000:8000 pyocr-toolkit
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/config && break; sleep 1; done
          curl -sf http://localhost:8000/ | grep -q "pyocr"
          docker exec pyocr pyocr doctor
